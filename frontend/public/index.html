<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration Flow</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Register</h1>
      <p id="status" class="status"></p>

      <form id="step1" class="card">
        <h2>Step 1: Basic Details</h2>
        <label>Name <input id="name" type="text" required /></label>
        <label>Mobile No <input id="mobileNo" type="tel" required maxlength="10" /></label>
        <button type="submit">Continue</button>
      </form>

      <form id="step2" class="card hidden">
        <h2>Step 2: Set Password</h2>
        <label>Password <input id="password" type="password" required /></label>
        <label>Confirm Password <input id="confirmPassword" type="password" required /></label>
        <small id="strength"></small>
        <button type="submit">Register + Send OTP</button>
      </form>

      <form id="step3" class="card hidden">
        <h2>Step 3: Verify OTP</h2>
        <label>OTP <input id="otp" type="text" maxlength="6" required /></label>
        <div class="row">
          <button type="submit">Verify OTP</button>
          <button id="resendOtp" type="button">Resend OTP</button>
        </div>
      </form>

      <form id="loginForm" class="card hidden">
        <h2>Login</h2>
        <label>Mobile No <input id="loginMobile" type="tel" required maxlength="10" /></label>
        <label>Password <input id="loginPassword" type="password" required /></label>
        <button type="submit">Login</button>
      </form>
    </main>

    <script src="app.js"></script>
  </body>
</html>
